# 나의 AI 증권사 — 설정 파일
# 이 파일만 고치면 관심종목과 거르는 규칙이 바뀝니다.

# 관심종목 (6자리 종목코드: 종목명은 메모용)
watchlist:
  "005930": 삼성전자
  "000660": SK하이닉스
  "035420": NAVER
  "035720": 카카오
  "005380": 현대차
  "068270": 셀트리온
  "105560": KB금융
  "051910": LG화학

# 얼마나 과거까지 볼지 (영업일 기준이 아니라 달력 기준 일수)
lookback_days: 400

# 아침 필터: 아래 조건을 '점수'로 매겨서 상위 N개만 6부서 회의에 올립니다.
screen:
  top_n: 3
  rules:
    above_ma60: 1        # 종가가 60일 이동평균 위 (추세 살아있음)
    ma20_over_ma60: 1    # 20일선이 60일선 위 (정배열)
    rsi_not_overheated: 1  # RSI(14) 70 미만 (과열 아님)
    volume_surge: 1      # 거래량이 20일 평균의 1.5배 이상
    near_52w_high: 1     # 52주 신고가 대비 -10% 이내
    foreign_net_buy: 1   # 최근 5일 외국인 순매수 (KRX 로그인 필요)

# 리스크 원칙 — 리스크관리부가 이 숫자를 기준으로 판단합니다.
risk:
  max_position_pct: 10   # 한 종목에 전체 자산의 10% 초과 금지
  stop_loss_pct: 7       # 매수가 대비 -7%면 손절 검토
  max_daily_new_buys: 1  # 하루 신규 매수 최대 1건
