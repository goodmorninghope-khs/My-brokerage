# 나의 AI 증권사 — 설정 파일
# 이 파일만 고치면 관심종목과 거르는 규칙이 바뀝니다.

# 관심종목 (6자리 종목코드: 종목명은 메모용) — 항상 분석합니다.
watchlist:
  "005930": 삼성전자
  "000660": SK하이닉스
  "066570": LG전자
  "000990": DB하이텍
  "005380": 현대차
  "034020": 두산에너빌리티
  "052690": 한전기술

# 시가총액 상위 종목도 매일 아침 KRX에서 새로 받아 관심종목에 더합니다.
# (순위가 바뀌므로 목록을 고정하지 않습니다. KRX 접속이 안 되면 위 관심종목만 분석)
market_cap_top:
  count: 50                 # 상위 몇 위까지
  market: ALL               # KOSPI / KOSDAQ / ALL
  exclude_preferred: true   # 삼성전자우 같은 우선주 제외

# 얼마나 과거까지 받을지 (달력 기준 일수). 백테스트에 3년치를 씁니다.
lookback_days: 1100

# 스크리닝부: 오늘 셋업(돌파·눌림목·모멘텀·추세지속·반전)이 성립한 종목 중
# 리스크 통과 → 백테스트 성적 순으로 상위 N개만 부서 회의에 올립니다.
screen:
  top_n: 3

# 운용부: 손절은 -5%(risk.stop_loss_pct), 익절은 2단계로 나눠 팝니다.
plan:
  take_profit:        # [수익률 %, 파는 비율]
    - [10, 0.5]       # +10%에서 절반
    - [15, 0.5]       # +15%에서 나머지
  max_hold_days: 20      # 이 기간 안에 목표·손절 어느 쪽도 안 닿으면 정리

# 리스크관리부: 5가지 기준. 하나라도 걸리면 '차단 → 매매 보류'.
risk:
  capital: 10000000          # 운용 기준 자산 1,000만 원 (2026-10-21 대표님 확정: 계좌 총액과 별개로 이 시스템은 1,000만 원 기준)
  risk_per_trade_pct: 1      # 한 번 손절로 잃어도 되는 돈 = 자산의 1%
  max_position_pct: 20       # 01 투자비중: 한 종목 최대 20%
  position_flex_pct: 5       #    보유 종목은 유연하게: 25%를 넘을 때만 경고 (강제 축소 없음)
  max_total_exposure_pct: 70 # 02 총노출: 주식 70% · 현금 30% 원칙
  min_rr: 2.0                # 03 손익비: 최소 1:2
  stop_loss_pct: 5           # 04 최대손실: 손절 -5% (셋업 손절이 더 가까우면 그쪽)
  max_atr_pct: 5             # 05 변동성: 하루 평균 변동폭(ATR) 5% 초과 종목은 차단
  max_daily_new_buys: 1
  pause_until: 2026-10-16       # 이 날짜까지 실전 신규 매수 쉬기 (모의투자만). 비우면 해제

# 지금 들고 있는 종목 (총노출 계산용). 예: "005930": {shares: 10, avg_price: 70000}
# (2026-10-21 갱신: 삼성전자 10주 전량 @220,000 매도, SK하이닉스 1주 @1,260,000 매도 → 하이닉스 1주 보유)
portfolio:
  "000660": {name: SK하이닉스, shares: 1, avg_price: 1200000}
